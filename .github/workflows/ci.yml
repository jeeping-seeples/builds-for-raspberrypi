name: Build Lite XL (Raspberry Pi ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git meson ninja-build curl build-essential \
            libsdl2-dev libfreetype6-dev libpcre2-dev

      - name: Clone Lite XL source (v2.1.7)
        run: |
          git clone --depth 1 --branch v2.1.7 https://github.com/lite-xl/lite-xl.git lite-xl-src

      - name: Configure and compile Portable Release
        run: |
          meson setup --buildtype=release -Dportable=true -Dprefix=/ lite-xl-src/build lite-xl-src
          meson compile -C lite-xl-src/build
          DESTDIR="$GITHUB_WORKSPACE/lite-xl-rpi-arm64" meson install -C lite-xl-src/build

      - name: Build and install Terminal plugin directly
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lite-xl-rpi-arm64/data/plugins/terminal"
          git clone --depth 1 https://github.com/adamharrison/lite-xl-terminal.git terminal-src
          cd terminal-src
          ./build.sh
          cp -R plugins/terminal/* "$GITHUB_WORKSPACE/lite-xl-rpi-arm64/data/plugins/terminal/"
          cp libterminal.so "$GITHUB_WORKSPACE/lite-xl-rpi-arm64/data/plugins/terminal/"

      - name: Install Settings GUI & Widget plugins
        run: |
          PLUGINS_DIR="$GITHUB_WORKSPACE/lite-xl-rpi-arm64/data/plugins"
          curl -sSL https://raw.githubusercontent.com/lite-xl/lite-xl-plugins/master/plugins/widget.lua -o "$PLUGINS_DIR/widget.lua"
          curl -sSL https://raw.githubusercontent.com/lite-xl/lite-xl-plugins/master/plugins/settings.lua -o "$PLUGINS_DIR/settings.lua"

      - name: Package tarball for Raspberry Pi
        run: |
          tar -czf lite-xl-rpi-arm64.tar.gz -C "$GITHUB_WORKSPACE" lite-xl-rpi-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-xl-rpi-arm64
          path: lite-xl-rpi-arm64.tar.gz
